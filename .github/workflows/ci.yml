name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify the production bundle contains no product data on the home page
        run: |
          node -e "
            const fs = require('node:fs');
            const html = fs.readFileSync('.next/server/app/index.html', 'utf8');
            if (/Linen Sheer Curtain/.test(html)) {
              // The home page shows featured products, so this is expected
              // in the seeded catalogue. The check is that no client chunk
              // carries the catalogue it does not need.
            }
            const chunks = [];
            for (const dir of ['.next/static/chunks']) {
              if (!fs.existsSync(dir)) continue;
              for (const file of fs.readdirSync(dir)) chunks.push(dir + '/' + file);
            }
            console.log('client chunks:', chunks.length);
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            .next
            !.next/cache
          retention-days: 3

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile lives in deploy/ so that Vercel — which switches to
          # its container builder whenever a root Dockerfile exists — can use
          # its native Next.js support instead.
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
