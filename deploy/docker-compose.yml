# Desired Homes Interiors, local/production compose definition.
#
#   cp .env.example .env      # then fill in ADMIN_* and NEXT_PUBLIC_SITE_URL
#   docker compose up -d
#
# The dashboard is served from the ADMIN_HOST below; the shop from the other
# host. Both point at the same container, which is how they stay in sync.

services:
  web:
    build: .
    image: desired-homes-interiors:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Public site origin (canonical URLs, sitemap, Open Graph).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Hostname that serves the dashboard. `admin.localhost` resolves to
      # 127.0.0.1 on most systems, so no DNS entry is needed locally.
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost:3000}
      # Signing key for dashboard sessions (32+ characters).
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      # scrypt hash of the dashboard password, see `npm run admin:hash`.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
    volumes:
      # Catalogue, contact details, reviews and analytics, must survive redeploys.
      - store-data:/app/data
      # Images uploaded through the dashboard.
      - uploads:/app/public/uploads

volumes:
  store-data:
  uploads:
